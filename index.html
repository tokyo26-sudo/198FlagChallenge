<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>199択国旗クイズ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%87%BA%F0%9F%87%B3</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0D2B5B;
    --navy-deep:#081B3D;
    --white:#F5F7FA;
    --red:#D01C3C;
    --blue-accent:#7EB6FF;
    --blue-success:#F5F7FA;
    --panel:#123167;
    --stamp-gold:#F0B429;
    --line:rgba(245,247,250,0.16);
    --tile1-bg:#2B4EA8;
    --tile1-text:#F5F7FA;
    --tile2-bg:#F5F7FA;
    --tile2-text:#0D2B5B;
    --tile3-bg:#D01C3C;
    --tile3-text:#F5F7FA;
  }
  *{box-sizing:border-box; font-variant-numeric: tabular-nums;}
  label.opt{
    transition:color .12s ease;
  }
  label.opt.opt-active{
    color:var(--blue-accent) !important;
    font-weight:700;
  }
  label.opt:has(input:checked){
    color:var(--blue-accent) !important;
    font-weight:700;
  }
  /* ラジオボタンの見た目をブラウザ依存にせず完全に自前で描画する */
  label.opt input[type="radio"]{
    -webkit-appearance:none;
    appearance:none;
    width:15px;
    height:15px;
    min-width:15px;
    border:2px solid rgba(245,247,250,0.5);
    border-radius:50%;
    margin:0;
    cursor:pointer;
    position:relative;
    background:transparent;
    flex:none;
  }
  label.opt input[type="radio"]:checked{
    border-color:var(--blue-accent);
  }
  label.opt input[type="radio"]:checked::after{
    content:"";
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--blue-accent);
  }
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 12% -10%, rgba(208,28,60,0.18), transparent 40%),
      radial-gradient(circle at 100% 0%, rgba(126,182,255,0.14), transparent 45%),
      var(--navy-deep);
    color:var(--white);
    font-family:'Noto Sans JP', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .app{
    width:100%;
    max-width:760px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:8px;
  }
  .lang-toggle{
    display:flex;
    gap:4px;
    align-self:center;
  }
  .lang-flag-btn{
    background:transparent;
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px 8px;
    font-size:18px;
    line-height:1;
    cursor:pointer;
    opacity:0.45;
    filter:grayscale(60%);
    transition:opacity .15s ease, filter .15s ease, border-color .15s ease;
  }
  .lang-flag-btn:hover{opacity:0.8;}
  .lang-flag-btn.active{
    opacity:1;
    filter:none;
    border-color:var(--blue-accent);
  }
  @media (max-width:480px){
    body.in-play header{display:none;}
  }
  .title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.02em;
  }
  .title small{
    display:inline;
    font-family:'Space Grotesk',sans-serif;
    font-weight:400;
    font-size:14px;
    color:var(--blue-accent);
    letter-spacing:0.05em;
    margin-left:8px;
  }
  .score{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    color:var(--white);
    opacity:0.8;
    text-align:right;
  }
  .score b{color:var(--blue-accent); font-size:16px;}

  .mode-switch{
    display:flex;
    gap:8px;
    margin-bottom:20px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px;
  }
  .mode-switch button{
    flex:1;
    border:none;
    background:transparent;
    color:var(--white);
    opacity:0.6;
    padding:12px 12px;
    border-radius:999px;
    font-family:'Noto Sans JP',sans-serif;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:all .2s ease;
  }
  .mode-switch button.active{
    background:var(--red);
    opacity:1;
    box-shadow:0 4px 14px rgba(208,28,60,0.4);
  }

  .challenge-status{
    font-family:'Space Grotesk',sans-serif;
    font-size:14px;
    color:var(--blue-accent);
    font-weight:700;
  }

  .play-start-row{
    display:flex;
    gap:10px;
    margin-top:4px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .settings-link{
    display:block;
    width:100%;
    background:transparent;
    border:1px solid var(--line);
    color:rgba(245,247,250,0.7);
    padding:10px 16px;
    border-radius:10px;
    font-family:'Noto Sans JP',sans-serif;
    font-size:13px;
    cursor:pointer;
    text-align:center;
    transition:border-color .15s ease, color .15s ease;
  }
  .settings-link:hover{border-color:var(--blue-accent); color:var(--blue-accent);}
  .settings-modal{
    text-align:left;
  }
  .settings-modal .result-label{
    text-align:center;
  }
  .settings-section{
    margin-top:16px;
  }
  .settings-section:first-of-type{margin-top:10px;}
  .settings-label{
    font-size:12px;
    color:rgba(245,247,250,0.7);
    font-family:'Space Grotesk',sans-serif;
    margin-bottom:8px;
  }
  .settings-options{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
  }
  .settings-options label.opt{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:13px;
    cursor:pointer;
  }
  .settings-options input[type="radio"]{accent-color:var(--blue-accent);}
  .start-btn{
    flex:1;
    min-width:160px;
    border:none;
    padding:16px 18px;
    border-radius:14px;
    font-family:'Noto Sans JP',sans-serif;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    text-align:center;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .start-btn:hover{transform:translateY(-2px);}
  .start-btn.tile1{
    background:var(--tile1-bg);
    color:var(--tile1-text);
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
  }
  .start-btn.tile2{
    background:var(--tile2-bg);
    color:var(--tile2-text);
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
  }
  .start-btn.tile3{
    background:var(--tile3-bg);
    color:var(--tile3-text);
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
  }
  .start-btn small{
    display:block;
    font-weight:400;
    font-size:11px;
    margin-top:3px;
    opacity:0.85;
  }

  .play-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .back-btn{
    background:transparent;
    border:1px solid var(--line);
    color:rgba(245,247,250,0.75);
    padding:8px 16px;
    border-radius:999px;
    font-family:'Noto Sans JP',sans-serif;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .15s ease, color .15s ease;
  }
  .back-btn:hover{border-color:var(--blue-accent); color:var(--blue-accent);}
  .giveup-btn:hover{border-color:var(--red); color:var(--red);}
  .giveup-btn.armed{
    border-color:var(--red);
    color:var(--red);
    background:rgba(208,28,60,0.15);
    font-weight:700;
  }

  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(6,10,20,0.82);
    backdrop-filter:blur(3px);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
  }
  .modal-overlay.show{display:flex;}
  .result-stage{
    background:var(--panel);
    border:1px solid var(--blue-accent);
    border-radius:18px;
    padding:24px 20px;
    text-align:center;
    width:100%;
    max-width:440px;
    max-height:88vh;
    overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .result-stage .result-label{
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--blue-accent);
    text-transform:uppercase;
    margin-bottom:8px;
    font-family:'Space Grotesk',sans-serif;
  }
  .result-score{
    font-family:'Space Grotesk',sans-serif;
    font-size:52px;
    font-weight:700;
  }
  .result-score span{font-size:20px; opacity:0.7; margin-left:4px;}
  .result-sub{
    margin-top:6px;
    font-size:13px;
    color:rgba(245,247,250,0.75);
  }
  .result-list{
    margin-top:18px;
    text-align:left;
    max-height:340px;
    overflow-y:auto;
    border-top:1px solid var(--line);
  }
  .result-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 4px;
    border-bottom:1px solid var(--line);
  }
  .result-row .result-flag{
    width:44px;
    aspect-ratio:3/2;
    flex:none;
    border-radius:4px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.08);
  }
  .result-row .result-flag img{width:100%;height:100%;object-fit:contain;display:block;}
  .result-row .result-name{
    flex:1;
    font-size:13px;
  }
  .result-row .result-mark{
    font-family:'Space Grotesk',sans-serif;
    font-size:12px;
    font-weight:700;
    flex:none;
  }
  .result-row.correct .result-mark{color:var(--blue-success);}
  .result-row.wrong .result-mark{color:var(--red);}
  .result-row .result-pts{
    font-family:'Space Grotesk',sans-serif;
    font-size:12px;
    color:rgba(245,247,250,0.6);
    flex:none;
    width:56px;
    text-align:right;
  }
  .result-stage.lap-mode .result-list,
  .result-stage.lap-mode .share-box{
    display:none;
  }
  .share-box{
    margin-top:18px;
    padding-top:14px;
    border-top:1px solid var(--line);
    text-align:left;
  }
  .share-box textarea{
    width:100%;
    resize:none;
    background:var(--navy-deep);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--white);
    font-family:'Noto Sans JP',sans-serif;
    font-size:12px;
    padding:10px;
    margin-top:6px;
    margin-bottom:8px;
  }
  .share-copy-btn{
    background:transparent;
    border:1px solid var(--blue-accent);
    color:var(--blue-accent);
    padding:8px 18px;
    border-radius:999px;
    font-family:'Noto Sans JP',sans-serif;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
  }
  .share-copy-btn:hover{background:var(--blue-accent); color:var(--navy-deep);}
  .share-copied-note{
    margin-left:10px;
    font-size:12px;
    color:var(--blue-success);
    opacity:0;
    transition:opacity .2s ease;
  }
  .share-copied-note.show{opacity:1;}

  .result-actions{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:18px;
    flex-wrap:wrap;
  }
  .result-actions button{
    padding:10px 22px;
    border-radius:999px;
    font-family:'Noto Sans JP',sans-serif;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    border:none;
  }
  #retryChallengeBtn{background:var(--blue-accent); color:var(--navy-deep); font-weight:700;}
  #endChallengeBtn{background:transparent; border:1px solid var(--line); color:var(--white);}

  .stage{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:14px;
    position:relative;
    overflow:hidden;
  }
  .stage-label{
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--blue-accent);
    text-transform:uppercase;
    margin-bottom:0;
    font-family:'Space Grotesk',sans-serif;
  }
  .stage-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .pass-btn{
    background:transparent;
    border:1px solid var(--line);
    color:rgba(245,247,250,0.65);
    font-size:11px;
    padding:5px 12px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    font-family:'Noto Sans JP',sans-serif;
    transition:border-color .15s ease, color .15s ease;
  }
  .pass-btn:hover{border-color:var(--blue-accent); color:var(--blue-accent);}
  .pass-btn:disabled{opacity:0.35; cursor:default; pointer-events:none;}
  .question-flag{
    width:150px;
    max-width:55%;
    aspect-ratio:3/2;
    border-radius:8px;
    margin:0 auto 4px;
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
    border:1px solid rgba(255,255,255,0.1);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:rgba(255,255,255,0.03);
  }
  .question-flag img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .question-flag.emoji{
    filter:drop-shadow(0 10px 22px rgba(0,0,0,0.4));
  }
  .question-name{
    text-align:center;
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;
    font-weight:700;
    padding:4px 0 0;
    letter-spacing:0.01em;
  }
  .feedback{
    text-align:center;
    min-height:0;
    font-size:14px;
    font-weight:500;
    margin-top:4px;
  }
  .feedback-flag{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:42px;
    aspect-ratio:3/2;
    vertical-align:middle;
    margin-right:6px;
    border-radius:4px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.03);
  }
  .feedback-flag img{width:100%;height:100%;object-fit:contain;display:block;}
  .feedback.correct{color:var(--blue-success);}
  .feedback.wrong{color:var(--red);}

  .stamp{
    position:absolute;
    top:18px;
    right:22px;
    border:3px solid var(--stamp-gold);
    color:var(--stamp-gold);
    border-radius:10px;
    padding:4px 10px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.08em;
    transform:rotate(-12deg) scale(0);
    opacity:0;
    transition:transform .35s cubic-bezier(.2,1.4,.4,1), opacity .2s ease;
    pointer-events:none;
  }
  .stamp.show{
    transform:rotate(-12deg) scale(1);
    opacity:1;
  }

  .next-btn{
    display:none;
    margin:12px auto 0;
    background:var(--blue-accent);
    color:var(--navy-deep);
    border:none;
    padding:9px 24px;
    border-radius:999px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .next-btn.show{display:block;}

  .filter-row{
    margin-bottom:12px;
  }
  .filter-row input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--white);
    padding:11px 14px;
    font-family:'Noto Sans JP',sans-serif;
    font-size:14px;
  }
  .filter-row input::placeholder{color:rgba(245,247,250,0.4);}
  .sort-row{
    margin-bottom:12px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .sort-row .sort-label{
    font-size:12px;
    color:rgba(245,247,250,0.7);
    white-space:nowrap;
    font-family:'Space Grotesk',sans-serif;
  }
  .flag-display-note{
    width:100%;
    font-size:11px;
    color:rgba(245,247,250,0.55);
    margin-top:2px;
  }
  .sort-row label.opt{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:13px;
    cursor:pointer;
  }
  .sort-row input[type="radio"]{
    accent-color:var(--blue-accent);
  }
  .size-row{
    margin-bottom:12px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .size-row input[type="range"]{
    flex:0 1 140px;
  }
  .flag-sort-options{
    display:flex;
    gap:12px;
    align-items:center;
  }
  .flag-sort-options label.opt{
    display:flex;
    align-items:center;
    gap:4px;
    font-size:12px;
    cursor:pointer;
    white-space:nowrap;
  }
  .flag-sort-options input[type="radio"]{accent-color:var(--blue-accent);}
  @media (max-width:480px){
    .size-row input[type="range"]{flex:1 1 100%; order:1;}
    .flag-sort-options{flex-basis:100%; order:2;}
  }
  .size-row label{
    font-size:12px;
    color:rgba(245,247,250,0.7);
    white-space:nowrap;
    font-family:'Space Grotesk',sans-serif;
  }
  .size-row input[type="range"]{
    flex:1;
    accent-color:var(--blue-accent);
  }
  .filter-count{
    font-size:11px;
    color:rgba(245,247,250,0.5);
    margin-top:6px;
    font-family:'Space Grotesk',sans-serif;
  }

  .choices{
    display:grid;
    gap:8px;
    max-height:420px;
    overflow-y:auto;
    padding-right:4px;
  }
  .choices.flags{
    grid-template-columns:repeat(auto-fill, minmax(var(--flag-size, 260px), 1fr));
  }
  .choices.names{
    grid-template-columns:repeat(2, 1fr);
  }
  @media (max-width:480px){
    .choices.flags{grid-template-columns:repeat(auto-fill, minmax(calc(var(--flag-size, 260px) * 0.75), 1fr));}
    .choices.names{grid-template-columns:1fr;}
  }

  .choice{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    cursor:pointer;
    color:var(--white);
    font-family:'Noto Sans JP',sans-serif;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .choice:hover{transform:translateY(-2px); border-color:var(--blue-accent);}

  .choice.flag-choice{
    flex-direction:column;
    padding:6px 4px 8px;
  }
  .choice.flag-choice .flag-visual{
    width:100%;
    aspect-ratio:3/2;
    border-radius:5px;
    margin-bottom:4px;
    border:1px solid rgba(255,255,255,0.08);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:rgba(255,255,255,0.03);
  }
  .choice.flag-choice .flag-visual img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .choice.flag-choice .flag-visual.emoji{
    /* SVGのtextLengthでハコいっぱいに引き伸ばすため、font-size指定は不要 */
  }

  .choice.name-choice{
    padding:12px 10px;
    font-size:13px;
    font-weight:500;
  }

  .choice.correct{
    background:rgba(245,247,250,0.22);
    border-color:var(--blue-success);
  }
  .choice.wrong{
    background:rgba(208,28,60,0.22);
    border-color:var(--red);
  }
  .choice.disabled{
    pointer-events:none;
    opacity:0.55;
  }
  .choice.disabled.correct,
  .choice.disabled.wrong{
    opacity:1;
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(245,247,250,0.2); border-radius:4px;}

  footer{
    text-align:center;
    font-size:11px;
    color:rgba(245,247,250,0.35);
    margin-top:24px;
    font-family:'Space Grotesk',sans-serif;
  }
</style>
</head>
<body>
<div class="app">
  <header>

    <div class="play-start-row">

function pickFourChoiceOptions(pool, correctCountry){
  const distractors = [];
  const usedCodes = new Set([correctCountry.code]);

  // ① 見た目（国名→国旗モード）or 名前（国旗→国名モード）が紛らわしい有名グループを最優先で使う
  const groupMap = mode === "nameToFlag" ? CONFUSABLE_GROUP_MAP : NAME_CONFUSABLE_GROUP_MAP;
  const confusableGroup = groupMap[correctCountry.code];
  if(confusableGroup){
    const confusableCandidates = shuffle(
      pool.filter(c => confusableGroup.includes(c.code) && !usedCodes.has(c.code))
    );
    for(const c of confusableCandidates){
      if(distractors.length >= 3) break;
      distractors.push(c);
      usedCodes.add(c.code);
    }
  }

  // ② 足りない分は同じ地域から補う
  if(distractors.length < 3){
    const sameRegion = shuffle(
      pool.filter(c => c.region === correctCountry.region && !usedCodes.has(c.code))
    );
    for(const c of sameRegion){
      if(distractors.length >= 3) break;
      distractors.push(c);
      usedCodes.add(c.code);
    }
  }

  // ③ それでも足りなければ全体からランダムに補う
  if(distractors.length < 3){
    const rest = shuffle(pool.filter(c => !usedCodes.has(c.code)));
    while(distractors.length < 3 && rest.length){
      const c = rest.pop();
      distractors.push(c);
      usedCodes.add(c.code);
    }
  }

  return shuffle([correctCountry, ...distractors]);
}

function sortCountries(list, sortMode){
  const sorted = [...list];
  if(sortMode === "region"){
    sorted.sort((a,b) => {
      const ri = REGION_ORDER.indexOf(a.region) - REGION_ORDER.indexOf(b.region);
      if(ri !== 0) return ri;
      return a.yomi.localeCompare(b.yomi, 'ja');
    });
  }else if(sortMode === "en"){
    sorted.sort((a,b) => a.en.localeCompare(b.en));
  }else{
    sorted.sort((a,b) => a.yomi.localeCompare(b.yomi, 'ja'));
  }
  return sorted;
}

let audioCtx = null;
function playCorrectSound(){
  if(!soundEnabled) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    [523.25, 783.99].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now + i * 0.08);
      gain.gain.linearRampToValueAtTime(0.15, now + i * 0.08 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.35);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + i * 0.08);
      osc.stop(now + i * 0.08 + 0.36);
    });
  }catch(e){ /* オーディオ非対応環境では無音のまま続行 */ }
}

function playWrongSound(){
  if(!soundEnabled) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(85, now + 0.3);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.18, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.33);
  }catch(e){ /* オーディオ非対応環境では無音のまま続行 */ }
}

const SCORE_DECAY_PER_TENTH_FOUR = 10; // 4択：0.1秒ごとに10点減点（1秒で100点減点）

function scoreForAnswer(correct, isPass, timeSec){
  if(isPass || !correct) return 0;
  const overSeconds = Math.max(0, timeSec - 1);
  let pts;
  if(answerFormat === "four"){
    // 4択：一次関数（比例）で減点、0.1秒ごとに10点
    pts = SCORE_MAX_PER_Q - SCORE_DECAY_PER_TENTH_FOUR * (overSeconds * 10);
  } else {
    // 199択：従来どおり一次関数（比例）で減点
    pts = SCORE_MAX_PER_Q - SCORE_DECAY_PER_TENTH_ALL * (overSeconds * 10);
  }
  return Math.max(1, Math.round(pts)); // 正解なら時間切れでも最低1点は入る
}

function formatCountdown(ms){
  const totalSec = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

  backToSetupBtn: document.getElementById('backToSetupBtn'),
  giveUpBtn: document.getElementById('giveUpBtn'),
};

function flagUrl(code){
  return `https://flagcdn.com/w320/${code.toLowerCase()}.png`;
}

function flagEmoji(code){
  // XKなど地域コードは正式な絵文字が無い場合があるため例外的に処理
  if(code === "XK") return "🇽🇰";
  return String.fromCodePoint(...[...code.toUpperCase()].map(ch => 0x1F1A5 + ch.charCodeAt(0)));
}

// 絵文字フォールバック表示：ハコいっぱいを狙って無理に幅を引き伸ばすと国旗の形が歪むため、
// 高さをハコに合わせつつ絵文字本来の縦横比はキープする（軽いレターボックスは許容）
function flagEmojiSvg(code){
  const w = 150, h = 100;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;display:block;"><text x="${w/2}" y="${h/2}" font-size="${h*0.92}" text-anchor="middle" dominant-baseline="central">${flagEmoji(code)}</text></svg>`;
}

// 画像がロードできればflagcdn.comの画像を、失敗したら絵文字国旗（SVG引き伸ばし版）に自動フォールバックする
function handleFlagImgError(imgEl){
  const container = imgEl.parentElement;
  container.classList.add('emoji');
  container.innerHTML = flagEmojiSvg(container.dataset.code);
}
window.handleFlagImgError = handleFlagImgError;

function flagVisualHtml(code, containerClass){
  if(flagDisplayMode === "emoji"){
    return `<div class="${containerClass} emoji" data-code="${code}">${flagEmojiSvg(code)}</div>`;
  }
  return `<div class="${containerClass}" data-code="${code}"><img src="${flagUrl(code)}" alt="${code}" onerror="handleFlagImgError(this)"></div>`;
}

function formatElapsed(ms){
  return (ms / 1000).toFixed(2);
}

function updateChallengeStatus(){
  if(!challengeActive){
    el.challengeStatus.textContent = "";
    return;
  }
  if(challengeType === "time"){
    const remaining = challengeEndTime - performance.now();
    if(remaining <= 0){
      finishChallenge();
      return;
    }
    el.challengeStatus.textContent = T[lang].elapsedRemaining(formatCountdown(remaining), challengeCount);
    return;
  }
  if(answered) return; // 回答後は表示を凍結（待ち時間ぶん伸び続けるのを防ぐ）
  const elapsed = formatElapsed(performance.now() - questionStartTime);
  el.challengeStatus.textContent = T[lang].elapsedThisQ(elapsed, challengeCount + 1, CHALLENGE_TARGET);
}

function showSetup(){
  el.setupScreen.style.display = "";
  el.playScreen.style.display = "none";
  document.body.classList.remove('in-play');
}

function showPlay(){
  el.setupScreen.style.display = "none";
  el.playScreen.style.display = "";
  document.body.classList.add('in-play');
}

function updateScoreDisplayMode(){
  el.normalScoreDisplay.style.display = challengeActive ? "none" : "";
  el.challengeStatus.style.display = challengeActive ? "" : "none";
}

function startChallenge(type){
  challengeType = type || "count";
  challengeActive = true;
  normalPlayActive = false;
  challengeCount = 0;
  challengeCorrect = 0;
  challengeResults = [];
  challengeStartTime = performance.now();
  challengeEndTime = challengeStartTime + TIME_CHALLENGE_DURATION_MS;
  questionQueue = shuffle(getPool()); // 重複しないよう新しい山札でスタート
  el.resultModalOverlay.classList.remove('show');
  updateScoreDisplayMode();
  showPlay();
  currentRetryFn = () => startChallenge(challengeType);
  if(challengeTimerId) clearInterval(challengeTimerId);
  challengeTimerId = setInterval(updateChallengeStatus, 100);
  pickQuestion();
  updateChallengeStatus();
}

function stopChallengeSilently(){
  challengeActive = false;
  if(challengeTimerId) clearInterval(challengeTimerId);
  challengeTimerId = null;
  el.challengeStatus.textContent = "";
  updateScoreDisplayMode();
}

function finishChallenge(){
  const elapsedMs = performance.now() - challengeStartTime;
  if(challengeTimerId) clearInterval(challengeTimerId);
  challengeTimerId = null;
  challengeActive = false;
  el.challengeStatus.textContent = "";
  updateScoreDisplayMode();
  el.resultModalOverlay.classList.add('show');
  el.resultStage.classList.remove('lap-mode');
  el.resultLabel.textContent = T[lang].resultTitleTimeAttack;

  const totalScore = challengeResults.reduce((sum, r) => sum + r.points, 0);
  const totalAnswered = challengeResults.length;
  const gaveUp = challengeType === "count" ? totalAnswered < CHALLENGE_TARGET : false;
  let shareLine1;
  if(challengeType === "count"){
    const maxPossible = SCORE_MAX_PER_Q * totalAnswered;
    el.resultScore.innerHTML = `${totalScore.toLocaleString()}<span>${T[lang].scoreOutOf(maxPossible.toLocaleString())}</span>`;
    el.resultSub.textContent = gaveUp
      ? T[lang].resultSubCountGaveUp(formatElapsed(elapsedMs), totalAnswered, challengeCorrect)
      : T[lang].resultSubCountDone(formatElapsed(elapsedMs), challengeCorrect);
    shareLine1 = `199択国旗クイズ【10問タイムアタック】\n${totalScore.toLocaleString()}点（${formatElapsed(elapsedMs)}秒 / 正解${challengeCorrect}問）`;
  }else{
    el.resultScore.innerHTML = `${totalScore.toLocaleString()}<span>${T[lang].scoreSuffix}</span>`;
    el.resultSub.textContent = T[lang].resultSubTime(totalAnswered, challengeCorrect);
    shareLine1 = `199択国旗クイズ【3分間チャレンジ】\n${totalScore.toLocaleString()}点（${totalAnswered}問回答 / 正解${challengeCorrect}問）`;
  }
  el.shareText.value = `${shareLine1}\n${location.href}`;
  el.shareCopiedNote.classList.remove('show');

  el.resultList.innerHTML = "";
  challengeResults.forEach(r => {
    const row = document.createElement('div');
    row.className = "result-row " + (r.correct ? "correct" : "wrong");
    const markText = r.isPass ? "PASS" : (r.correct ? "○" : "×");
    row.innerHTML = `
      ${flagVisualHtml(r.code, "result-flag")}
      <div class="result-name">${lang === "en" ? r.en : r.name}</div>
      <div class="result-mark">${markText}</div>
      <div class="result-pts">${r.points.toLocaleString()}${T[lang].scoreSuffix}</div>
    `;
    el.resultList.appendChild(row);
  });
}

// ---- 出題キュー：全199ヶ国を出し切るまで重複させないための山札方式 ----
let questionQueue = [];

function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function drawNextCountry(){
  if(questionQueue.length === 0){
    let newDeck = shuffle(getPool());
    // 山札を引き直した直後、直前に出た国と連続で同じ問題になるのを防ぐ
    if(current && newDeck.length > 1 && newDeck[newDeck.length - 1].code === current.code){
      [newDeck[0], newDeck[newDeck.length - 1]] = [newDeck[newDeck.length - 1], newDeck[0]];
    }
    questionQueue = newDeck;
  }
  return questionQueue.pop();
}

function pickQuestion(){
  current = drawNextCountry();
  answered = false;
  questionStartTime = performance.now();
  el.feedback.textContent = "";
  el.feedback.className = "feedback";
  el.nextBtn.classList.remove('show');
  el.stamp.classList.remove('show');
  el.passBtn.disabled = false;
  renderQuestion();
  renderChoices();
}

function renderQuestion(){
  if(mode === "nameToFlag"){
    el.stageLabel.textContent = T[lang].stageLabelNameToFlag;
    el.questionArea.innerHTML = `<div class="question-name">${countryName(current)}</div>`;
  }else{
    el.stageLabel.textContent = T[lang].stageLabelFlagToName;
    el.questionArea.innerHTML = flagVisualHtml(current.code, "question-flag");
  }
}

function renderChoices(){
  el.sizeRow.style.display = mode === "nameToFlag" ? "" : "none";
  el.flagSortRow.style.display = (mode === "nameToFlag" && answerFormat === "all") ? "" : "none";
  el.sortRow.style.display = (mode === "flagToName" && answerFormat === "all") ? "" : "none";

  const list = answerFormat === "four"
    ? pickFourChoiceOptions(COUNTRIES, current)
    : sortCountries(COUNTRIES, sortMode);

  el.choices.className = "choices " + (mode === "nameToFlag" ? "flags" : "names");
  el.choices.innerHTML = "";

  list.forEach(c => {
    const btn = document.createElement('div');
    btn.className = "choice " + (mode === "nameToFlag" ? "flag-choice" : "name-choice");
    btn.dataset.code = c.code;
    if(answered) btn.classList.add('disabled');

    if(mode === "nameToFlag"){
      btn.innerHTML = flagVisualHtml(c.code, "flag-visual");
    }else{
      btn.textContent = countryName(c);
    }

    if(answered && c.code === current.code) btn.classList.add('correct');

    btn.addEventListener('click', () => handleAnswer(c, btn));
    el.choices.appendChild(btn);
  });
}

function handleAnswer(selected, btnEl){
  if(answered) return;
  const isCorrect = selected.code === current.code;
  resolveQuestion({correct: isCorrect, btnEl, isPass:false});
}

function handlePass(){
  if(answered) return;
  resolveQuestion({correct:false, btnEl:null, isPass:true});
}

function resolveQuestion({correct, btnEl, isPass}){
  answered = true;
  el.passBtn.disabled = true;
  scoreTotal++;
  if(correct){
    scoreCorrect++;
    el.feedback.textContent = `${T[lang].correctPrefix} ${countryName(current)}`;
    el.feedback.className = "feedback correct";
    if(btnEl) btnEl.classList.add('correct');
    el.stamp.textContent = "CORRECT";
    el.stamp.style.borderColor = "var(--stamp-gold)";
    el.stamp.style.color = "var(--stamp-gold)";
    playCorrectSound();
  }else{
    const flagHint = mode === "nameToFlag" ? flagVisualHtml(current.code, "feedback-flag") : "";
    el.feedback.innerHTML = flagHint + (isPass
      ? `${T[lang].passPrefix} ${T[lang].answerIs(countryName(current))}`
      : `${T[lang].wrongPrefix} ${T[lang].answerIs(countryName(current))}`);
    el.feedback.className = "feedback wrong";
    if(btnEl) btnEl.classList.add('wrong');
    el.stamp.textContent = isPass ? "PASS" : "MISS";
    el.stamp.style.borderColor = "var(--red)";
    el.stamp.style.color = "var(--red)";
    playWrongSound();
  }
  el.stamp.classList.add('show');
  el.scoreCorrect.textContent = scoreCorrect;

  // 全選択肢を disabled にし、正解の選択肢をハイライト
  document.querySelectorAll('.choice').forEach(b => {
    b.classList.add('disabled');
    if(b.dataset.code === current.code) b.classList.add('correct');
  });

  if(challengeActive){
    const timeSec = (performance.now() - questionStartTime) / 1000;
    const points = scoreForAnswer(correct, isPass, timeSec);
    challengeResults.push({
      code: current.code,
      name: current.name,
      en: current.en,
      correct: correct && !isPass,
      isPass,
      timeSec,
      points
    });
    challengeCount++;
    if(correct) challengeCorrect++;
    if(challengeType === "count"){
      el.challengeStatus.textContent = T[lang].elapsedThisQAnswered(formatElapsed(timeSec * 1000), challengeCount, CHALLENGE_TARGET);
      if(challengeCount >= CHALLENGE_TARGET){
        setTimeout(finishChallenge, 500);
        return;
      }
    }else{
      // 3分間チャレンジ：時間切れ、または出題プールを1周し終えたら終了
      const lappedPool = challengeCount >= getPool().length;
      if(challengeEndTime - performance.now() <= 0 || lappedPool){
        setTimeout(finishChallenge, 500);
        return;
      }
    }
  }

  if(normalPlayActive){
    normalAnswered++;
    if(normalAnswered >= normalTarget){
      setTimeout(finishNormalPlay, 500);
      return;
    }
  }

  el.nextBtn.classList.add('show');
}

el.nextBtn.addEventListener('click', pickQuestion);

el.passBtn.addEventListener('click', handlePass);

el.retryChallengeBtn.addEventListener('click', () => {
  if(currentRetryFn) currentRetryFn();
});

el.copyShareBtn.addEventListener('click', async () => {
  const text = el.shareText.value;
  let copied = false;
  try{
    await navigator.clipboard.writeText(text);
    copied = true;
  }catch(e){
    // クリップボードAPIが使えない環境向けフォールバック
    try{
      el.shareText.focus();
      el.shareText.select();
      copied = document.execCommand('copy');
    }catch(e2){
      copied = false;
    }
  }
  if(copied){
    el.shareCopiedNote.classList.add('show');
    setTimeout(() => el.shareCopiedNote.classList.remove('show'), 2000);
  }else{
    el.shareText.focus();
    el.shareText.select();
  }
});

el.endChallengeBtn.addEventListener('click', () => {
  el.resultModalOverlay.classList.remove('show');
  scoreCorrect = 0;
  scoreTotal = 0;
  normalPlayActive = false;
  el.scoreCorrect.textContent = scoreCorrect;
  questionQueue = []; // 山札もリセットし、次にプレイ開始する時に新しくシャッフルさせる
  showSetup();
});

function syncSortRadios(){
  document.querySelectorAll('input[name="sortMode"], input[name="sortModeFlag"]').forEach(r => {
    r.checked = (r.value === sortMode);
  });
  updateOptActiveStyles('sortMode');
  updateOptActiveStyles('sortModeFlag');
}

// ラジオボタンの選択状態を、囲んでいるlabel.optの見た目（色・太字）に確実に反映させる
function updateOptActiveStyles(radioName){
  document.querySelectorAll(`input[name="${radioName}"]`).forEach(input => {
    const label = input.closest('label.opt');
    if(label) label.classList.toggle('opt-active', input.checked);
  });
}

// すべてのラジオボタングループを対象に、変更されたら見た目を同期する
document.addEventListener('change', (e) => {
  if(e.target.matches('input[type="radio"]') && e.target.name){
    updateOptActiveStyles(e.target.name);
  }
});

el.sortRadios.forEach(radio => {
  radio.addEventListener('change', (e) => {
    if(e.target.checked){
      sortMode = e.target.value;
      syncSortRadios();
      renderChoices();
    }
  });
});

el.flagDisplayRadios.forEach(radio => {
  radio.addEventListener('change', (e) => {
    if(e.target.checked){
      flagDisplayMode = e.target.value;
    }
  });
});

el.langFlagJa.addEventListener('click', () => applyLanguage('ja'));
el.langFlagEn.addEventListener('click', () => applyLanguage('en'));

el.difficultyRadios.forEach(radio => {
  radio.addEventListener('change', (e) => {
    if(e.target.checked){
      difficulty = e.target.value;
    }
  });
});

el.answerFormatRadios.forEach(radio => {
  radio.addEventListener('change', (e) => {
    if(e.target.checked){
      answerFormat = e.target.value;
    }
  });
});

el.colorThemeRadios.forEach(radio => {
  radio.addEventListener('change', (e) => {
    if(e.target.checked){
      applyTheme(e.target.value);
    }
  });
});

el.soundRadios.forEach(radio => {
  radio.addEventListener('change', (e) => {
    if(e.target.checked){
      soundEnabled = e.target.value === "on";
    }
  });
});

el.openSettingsBtn.addEventListener('click', () => {
  el.settingsModalOverlay.classList.add('show');
});

el.closeSettingsBtn.addEventListener('click', () => {
  el.settingsModalOverlay.classList.remove('show');
});

el.settingsModalOverlay.addEventListener('click', (e) => {
  if(e.target === el.settingsModalOverlay){
    el.settingsModalOverlay.classList.remove('show');
  }
});

el.sizeSlider.addEventListener('input', (e) => {
  document.documentElement.style.setProperty('--flag-size', e.target.value + 'px');
});

el.modeNameToFlag.addEventListener('click', () => {
  mode = "nameToFlag";
  el.modeNameToFlag.classList.add('active');
  el.modeFlagToName.classList.remove('active');
});
el.modeFlagToName.addEventListener('click', () => {
  mode = "flagToName";
  el.modeFlagToName.classList.add('active');
  el.modeNameToFlag.classList.remove('active');
});

function startNormalPlay(){
  scoreCorrect = 0;
  scoreTotal = 0;
  normalPlayActive = true;
  normalAnswered = 0;
  normalTarget = getPool().length;
  el.scoreCorrect.textContent = scoreCorrect;
  el.normalTargetDisplay.textContent = normalTarget;
  el.resultModalOverlay.classList.remove('show');
  questionQueue = [];
  updateScoreDisplayMode();
  showPlay();
  currentRetryFn = startNormalPlay;
  pickQuestion();
}

function finishNormalPlay(){
  normalPlayActive = false;
  const gaveUp = normalAnswered < normalTarget;
  el.resultModalOverlay.classList.add('show');
  el.resultStage.classList.add('lap-mode');
  el.resultLabel.textContent = gaveUp ? T[lang].resultTitleGiveUp : T[lang].resultTitleComplete;
  el.resultScore.innerHTML = gaveUp
    ? `${scoreCorrect}<span>${T[lang].correctOutOf(normalAnswered)}</span>`
    : `${scoreCorrect}<span>${T[lang].correctOutOf(normalTarget)}</span>`;
  el.resultSub.textContent = gaveUp
    ? T[lang].resultSubLapGiveUp(normalAnswered)
    : T[lang].resultSubLapDone(normalTarget);
}

el.startNormalBtn.addEventListener('click', startNormalPlay);

el.startChallengeBtn.addEventListener('click', () => startChallenge('count'));
el.startTimeChallengeBtn.addEventListener('click', () => startChallenge('time'));

el.backToSetupBtn.addEventListener('click', () => {
  if(challengeActive) stopChallengeSilently();
  normalPlayActive = false;
  showSetup();
});

let giveUpArmed = false;
let giveUpTimer = null;

el.giveUpBtn.addEventListener('click', () => {
  if(!giveUpArmed){
    giveUpArmed = true;
    el.giveUpBtn.textContent = T[lang].giveUpConfirmShort;
    el.giveUpBtn.classList.add('armed');
    if(giveUpTimer) clearTimeout(giveUpTimer);
    giveUpTimer = setTimeout(() => {
      giveUpArmed = false;
      el.giveUpBtn.textContent = T[lang].giveUp;
      el.giveUpBtn.classList.remove('armed');
    }, 3000);
    return;
  }
  clearTimeout(giveUpTimer);
  giveUpArmed = false;
  el.giveUpBtn.textContent = T[lang].giveUp;
  el.giveUpBtn.classList.remove('armed');
  if(challengeActive){
    finishChallenge();
  }else if(normalPlayActive){
    finishNormalPlay();
  }
});

// ---- 国旗Web画像が読み込める環境かどうかを起動時に判定し、読み込めない場合はWeb画像の選択肢を無効化する ----
(function checkFlagImageAvailability(){
  const img = new Image();
  let settled = false;
  const onUnavailable = () => {
    if(settled) return;
    settled = true;
    flagDisplayMode = "emoji";
    const webRadio = document.getElementById('flagDisplayWebRadio');
    const emojiRadio = document.getElementById('flagDisplayEmojiRadio');
    if(webRadio) webRadio.disabled = true;
    if(emojiRadio) emojiRadio.checked = true;
    const row = document.getElementById('flagDisplayRow');
    if(row && !row.querySelector('.flag-display-note')){
      const note = document.createElement('div');
      note.className = 'flag-display-note';
      note.textContent = 'この環境では国旗のWeb画像を読み込めないため、絵文字表示のみ利用できます';
      row.appendChild(note);
    }
  };
  img.onload = () => { settled = true; };
  img.onerror = onUnavailable;
  img.src = flagUrl('jp');
  setTimeout(onUnavailable, 4000); // 応答が長すぎる場合もWeb画像不可とみなす
})();

syncSortRadios();
["answerFormat", "difficulty", "colorTheme", "soundSetting", "flagDisplayMode"].forEach(updateOptActiveStyles);
</script>
